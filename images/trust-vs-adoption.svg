<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400">
  <defs>
    <linearGradient id="adoptionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="trustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="650" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="325" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e2e8f0" text-anchor="middle">The Trust-Adoption Paradox</text>
  <text x="325" y="55" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">More developers using AI, fewer trusting it</text>

  <!-- Y-axis -->
  <line x1="80" y1="80" x2="80" y2="320" stroke="#64748b" stroke-width="2"/>
  <text x="35" y="200" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" transform="rotate(-90, 35, 200)">Percentage</text>

  <!-- Y-axis ticks -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">
    <line x1="75" y1="92" x2="80" y2="92" stroke="#64748b" stroke-width="1"/>
    <text x="68" y="96" text-anchor="end">100%</text>

    <line x1="75" y1="140" x2="80" y2="140" stroke="#64748b" stroke-width="1"/>
    <text x="68" y="144" text-anchor="end">80%</text>

    <line x1="75" y1="188" x2="80" y2="188" stroke="#64748b" stroke-width="1"/>
    <text x="68" y="192" text-anchor="end">60%</text>

    <line x1="75" y1="236" x2="80" y2="236" stroke="#64748b" stroke-width="1"/>
    <text x="68" y="240" text-anchor="end">40%</text>

    <line x1="75" y1="284" x2="80" y2="284" stroke="#64748b" stroke-width="1"/>
    <text x="68" y="288" text-anchor="end">20%</text>

    <line x1="75" y1="320" x2="80" y2="320" stroke="#64748b" stroke-width="1"/>
    <text x="68" y="324" text-anchor="end">0%</text>
  </g>

  <!-- X-axis -->
  <line x1="80" y1="320" x2="580" y2="320" stroke="#64748b" stroke-width="2"/>

  <!-- X-axis labels -->
  <text x="165" y="340" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2023</text>
  <text x="330" y="340" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2024</text>
  <text x="495" y="340" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2025</text>

  <!-- Grid lines -->
  <g stroke="#374151" stroke-width="1" stroke-dasharray="4,4">
    <line x1="80" y1="140" x2="580" y2="140"/>
    <line x1="80" y1="188" x2="580" y2="188"/>
    <line x1="80" y1="236" x2="580" y2="236"/>
    <line x1="80" y1="284" x2="580" y2="284"/>
  </g>

  <!-- Vertical markers for years -->
  <line x1="165" y1="320" x2="165" y2="80" stroke="#374151" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="330" y1="320" x2="330" y2="80" stroke="#374151" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="495" y1="320" x2="495" y2="80" stroke="#374151" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- ADOPTION LINE (rising) -->
  <!-- 2023: ~65%, 2024: ~75%, 2025: 85% -->
  <path d="M165,176 Q247,152 330,140 T495,116"
        fill="none" stroke="url(#adoptionGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Data points for adoption -->
  <circle cx="165" cy="176" r="8" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="330" cy="140" r="8" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="495" cy="116" r="8" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>

  <!-- Adoption labels -->
  <text x="165" y="162" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="bold">65%</text>
  <text x="330" y="126" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="bold">75%</text>
  <text x="495" y="102" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="bold">85%</text>

  <!-- TRUST LINE (falling) -->
  <!-- 2023: ~50%, 2024: 40%, 2025: 29% -->
  <path d="M165,224 Q247,244 330,248 T495,275"
        fill="none" stroke="url(#trustGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Data points for trust -->
  <circle cx="165" cy="224" r="8" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
  <circle cx="330" cy="248" r="8" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
  <circle cx="495" cy="275" r="8" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>

  <!-- Trust labels -->
  <text x="165" y="246" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle" font-weight="bold">~50%</text>
  <text x="330" y="270" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle" font-weight="bold">40%</text>
  <text x="495" y="297" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle" font-weight="bold">29%</text>

  <!-- Gap annotation -->
  <line x1="520" y1="116" x2="520" y2="275" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="540" y="195" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24" font-weight="bold">56%</text>
  <text x="540" y="208" font-family="Arial, sans-serif" font-size="10" fill="#fbbf24">gap</text>

  <!-- Legend -->
  <rect x="100" y="355" width="200" height="35" rx="6" fill="#1e293b"/>
  <line x1="115" y1="370" x2="145" y2="370" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="130" cy="370" r="4" fill="#3b82f6"/>
  <text x="155" y="374" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd">AI Tool Adoption</text>

  <rect x="320" y="355" width="200" height="35" rx="6" fill="#1e293b"/>
  <line x1="335" y1="370" x2="365" y2="370" stroke="#ef4444" stroke-width="3"/>
  <circle cx="350" cy="370" r="4" fill="#ef4444"/>
  <text x="375" y="374" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5">Trust in AI Code</text>

  <!-- Source -->
  <text x="580" y="390" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="end">Source: JetBrains Developer Ecosystem 2025</text>
</svg>