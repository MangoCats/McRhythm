<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480">
  <defs>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="dataRight" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
    </marker>
    <marker id="dataLeft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="dataDown" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="blueDown" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="520" height="480" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="260" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Multi-Agent Orchestration Pattern</text>

  <!-- IBM quote (subtitle) -->
  <text x="260" y="50" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">"Bigger model orchestrates, smaller models execute" - IBM AI Agents 2025</text>

  <!-- User/Input -->
  <rect x="65" y="70" width="140" height="45" rx="8" fill="#374151" stroke="#6b7280" stroke-width="2"/>
  <text x="135" y="90" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">User Request</text>
  <text x="135" y="105" font-family="Arial, sans-serif" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">"Build feature X"</text>

  <!-- Arrow from User to Orchestrator -->
  <path d="M135,115 L135,145" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#blueDown)"/>

  <!-- ORCHESTRATOR (left side) -->
  <rect x="50" y="155" width="170" height="200" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="3" filter="url(#glow2)"/>
  <text x="135" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#93c5fd" text-anchor="middle">ORCHESTRATOR</text>
  <text x="135" y="205" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">(Larger Model)</text>
  <line x1="65" y1="220" x2="205" y2="220" stroke="#4b5563" stroke-width="1"/>
  <text x="135" y="240" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Task decomposition</text>
  <text x="135" y="255" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Delegation</text>
  <text x="135" y="270" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Synthesis</text>
  <line x1="65" y1="285" x2="205" y2="285" stroke="#4b5563" stroke-width="1"/>
  <text x="135" y="305" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Claude Opus</text>
  <text x="135" y="320" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">GPT-4, etc.</text>
  <text x="135" y="345" font-family="Arial, sans-serif" font-size="8" fill="#3b82f6" text-anchor="middle" font-style="italic">Controls workflow</text>

  <!-- SPECIALIST AGENTS (stacked on right) -->

  <!-- Specialist 1: Research -->
  <rect x="310" y="90" width="160" height="85" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="390" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#67e8f9" text-anchor="middle">Research Agent</text>
  <line x1="325" y1="125" x2="455" y2="125" stroke="#4b5563" stroke-width="1"/>
  <text x="390" y="143" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Retrieval + Summary</text>
  <text x="390" y="158" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Context isolation</text>

  <!-- Specialist 2: Coding -->
  <rect x="310" y="190" width="160" height="85" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="390" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c4b5fd" text-anchor="middle">Coding Agent</text>
  <line x1="325" y1="225" x2="455" y2="225" stroke="#4b5563" stroke-width="1"/>
  <text x="390" y="243" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Smaller model</text>
  <text x="390" y="258" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Focused context</text>

  <!-- Specialist 3: Verification -->
  <rect x="310" y="290" width="160" height="85" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="390" y="315" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#86efac" text-anchor="middle">Verification Agent</text>
  <line x1="325" y1="325" x2="455" y2="325" stroke="#4b5563" stroke-width="1"/>
  <text x="390" y="343" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Review + Testing</text>
  <text x="390" y="358" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Fact-checking</text>

  <!-- Arrows from Orchestrator to Specialists (blue, right) -->
  <path d="M220,190 L300,132" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#dataRight)"/>
  <path d="M220,255 L300,232" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#dataRight)"/>
  <path d="M220,320 L300,332" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#dataRight)"/>

  <!-- Return arrows from Specialists to Orchestrator (green, left) - parallel to blue arrows -->
  <path d="M300,147 L220,205" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#dataLeft)" stroke-dasharray="5,3"/>
  <path d="M300,247 L220,270" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#dataLeft)" stroke-dasharray="5,3"/>
  <path d="M300,347 L220,335" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#dataLeft)" stroke-dasharray="5,3"/>

  <!-- Synthesized Output (bottom) -->
  <rect x="50" y="390" width="170" height="55" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="135" y="415" font-family="Arial, sans-serif" font-size="11" fill="#86efac" text-anchor="middle">Synthesized Output</text>
  <text x="135" y="433" font-family="Arial, sans-serif" font-size="12" fill="#bbf7d0" text-anchor="middle" font-weight="bold">Complete Solution</text>

  <!-- Arrow from Orchestrator to Output -->
  <path d="M135,355 L135,380" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#dataDown)"/>

  <!-- Legend -->
  <rect x="310" y="400" width="160" height="55" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <line x1="325" y1="420" x2="355" y2="420" stroke="#60a5fa" stroke-width="2" marker-end="url(#dataRight)"/>
  <text x="365" y="424" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Task delegation</text>
  <line x1="355" y1="440" x2="325" y2="440" stroke="#34d399" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#dataLeft)"/>
  <text x="365" y="444" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Results returned</text>
</svg>
