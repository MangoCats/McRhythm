<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <defs>
    <linearGradient id="scaffoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="substituteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="350" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Scaffold vs Substitute Framework</text>

  <!-- Divider -->
  <line x1="350" y1="60" x2="350" y2="380" stroke="#4b5563" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- SCAFFOLD PATH (left) -->
  <text x="175" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#22c55e" text-anchor="middle">SCAFFOLD</text>

  <!-- Person with scaffolding stages -->
  <!-- Stage 1: Heavy scaffolding -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="60" height="80" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="30" cy="25" r="12" fill="#60a5fa"/>
    <line x1="30" y1="37" x2="30" y2="60" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="45" x2="15" y2="55" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="45" x2="45" y2="55" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="60" x2="20" y2="78" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="60" x2="40" y2="78" stroke="#60a5fa" stroke-width="3"/>
    <text x="30" y="95" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Learning</text>
  </g>

  <!-- Arrow -->
  <path d="M150,140 L170,140" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#greenArrow)"/>

  <!-- Stage 2: Less scaffolding -->
  <g transform="translate(175, 100)">
    <rect x="5" y="5" width="50" height="70" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
    <circle cx="30" cy="25" r="14" fill="#60a5fa"/>
    <line x1="30" y1="39" x2="30" y2="62" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="47" x2="12" y2="58" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="47" x2="48" y2="58" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="62" x2="18" y2="78" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="62" x2="42" y2="78" stroke="#60a5fa" stroke-width="3"/>
    <text x="30" y="95" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Growing</text>
  </g>

  <!-- Arrow -->
  <path d="M245,140 L265,140" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#greenArrow)"/>

  <!-- Stage 3: Independent -->
  <g transform="translate(270, 95)">
    <circle cx="30" cy="25" r="16" fill="#60a5fa"/>
    <line x1="30" y1="41" x2="30" y2="68" stroke="#60a5fa" stroke-width="4"/>
    <line x1="30" y1="50" x2="10" y2="62" stroke="#60a5fa" stroke-width="4"/>
    <line x1="30" y1="50" x2="50" y2="62" stroke="#60a5fa" stroke-width="4"/>
    <line x1="30" y1="68" x2="16" y2="88" stroke="#60a5fa" stroke-width="4"/>
    <line x1="30" y1="68" x2="44" y2="88" stroke="#60a5fa" stroke-width="4"/>
    <!-- Star/success indicator -->
    <polygon points="30,-5 32,0 38,0 33,4 35,10 30,6 25,10 27,4 22,0 28,0" fill="#fbbf24"/>
    <text x="30" y="105" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Independent</text>
  </g>

  <!-- Scaffold attributes -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="240" height="130" rx="8" fill="#14532d" opacity="0.5"/>
    <text x="120" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#86efac" text-anchor="middle">Characteristics</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#bbf7d0">Temporary support</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#bbf7d0">Adaptable to needs</text>
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="#bbf7d0">Empowers growth</text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" fill="#86efac" font-weight="bold">Goal: Need AI less over time</text>
  </g>

  <!-- SUBSTITUTE PATH (right) -->
  <text x="525" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ef4444" text-anchor="middle">SUBSTITUTE</text>

  <!-- Person with growing AI dependency -->
  <!-- Stage 1: Normal with small AI -->
  <g transform="translate(400, 100)">
    <circle cx="30" cy="25" r="12" fill="#60a5fa"/>
    <line x1="30" y1="37" x2="30" y2="60" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="45" x2="15" y2="55" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="45" x2="45" y2="55" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="60" x2="20" y2="78" stroke="#60a5fa" stroke-width="3"/>
    <line x1="30" y1="60" x2="40" y2="78" stroke="#60a5fa" stroke-width="3"/>
    <!-- Small AI box -->
    <rect x="50" y="30" width="20" height="20" rx="3" fill="#ef4444" opacity="0.7"/>
    <text x="60" y="44" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">AI</text>
    <text x="40" y="95" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Starting</text>
  </g>

  <!-- Arrow -->
  <path d="M490,140 L510,140" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#redArrow)"/>

  <!-- Stage 2: Shrinking person, bigger AI -->
  <g transform="translate(515, 105)">
    <circle cx="25" cy="22" r="10" fill="#60a5fa" opacity="0.7"/>
    <line x1="25" y1="32" x2="25" y2="52" stroke="#60a5fa" stroke-width="2.5" opacity="0.7"/>
    <line x1="25" y1="38" x2="13" y2="47" stroke="#60a5fa" stroke-width="2.5" opacity="0.7"/>
    <line x1="25" y1="38" x2="37" y2="47" stroke="#60a5fa" stroke-width="2.5" opacity="0.7"/>
    <line x1="25" y1="52" x2="17" y2="68" stroke="#60a5fa" stroke-width="2.5" opacity="0.7"/>
    <line x1="25" y1="52" x2="33" y2="68" stroke="#60a5fa" stroke-width="2.5" opacity="0.7"/>
    <!-- Bigger AI box -->
    <rect x="45" y="15" width="35" height="35" rx="5" fill="#ef4444"/>
    <text x="62" y="37" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">AI</text>
    <text x="45" y="90" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Depending</text>
  </g>

  <!-- Arrow -->
  <path d="M610,140 L630,140" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#redArrow)"/>

  <!-- Stage 3: Tiny person, dominant AI -->
  <g transform="translate(620, 100)">
    <!-- Tiny person -->
    <circle cx="15" cy="55" r="6" fill="#60a5fa" opacity="0.4"/>
    <line x1="15" y1="61" x2="15" y2="73" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
    <line x1="15" y1="65" x2="9" y2="70" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
    <line x1="15" y1="65" x2="21" y2="70" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
    <line x1="15" y1="73" x2="11" y2="82" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
    <line x1="15" y1="73" x2="19" y2="82" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
    <!-- Dominant AI -->
    <rect x="25" y="5" width="50" height="50" rx="8" fill="#ef4444"/>
    <text x="50" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">AI</text>
    <text x="40" y="100" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Dependent</text>
  </g>

  <!-- Substitute attributes -->
  <g transform="translate(400, 220)">
    <rect x="0" y="0" width="240" height="130" rx="8" fill="#7f1d1d" opacity="0.5"/>
    <text x="120" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fca5a5" text-anchor="middle">Characteristics</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#fecaca">Permanent dependency</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#fecaca">Assumes responsibility</text>
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="#fecaca">Creates atrophy</text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" fill="#fca5a5" font-weight="bold">Risk: Skills diminish over time</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Bottom message -->
  <text x="350" y="380" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-style="italic">"AI should complement, not replace, human reasoning"</text>
</svg>