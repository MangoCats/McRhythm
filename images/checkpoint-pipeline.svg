    <rect x="34" y="32" width="18" height="10" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="43" y="40" class="stick-text" text-anchor="middle" font-size="6">AI</text>
    <!-- Sparks/activity -->
    <path d="M 56 32 L 60 28" stroke="#000" stroke-width="1"/>
    <path d="M 56 38 L 62 38" stroke="#000" stroke-width="1"/>
    <path d="M 56 44 L 60 48" stroke="#000" stroke-width="1"/>
  </g>

  <g transform="translate(15, 285)">
    <!-- Developer 2 with AI -->
    <circle cx="20" cy="20" r="8" class="stick-fill"/>
    <path d="M 20 28 L 20 45" class="stick-line"/>
    <path d="M 20 32 L 12 40" class="stick-line"/>
    <path d="M 20 32 L 28 40" class="stick-line"/>
    <path d="M 20 45 L 14 58" class="stick-line"/>
    <path d="M 20 45 L 26 58" class="stick-line"/>
    <rect x="32" y="30" width="22" height="16" class="stick-fill"/>
    <rect x="34" y="32" width="18" height="10" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="43" y="40" class="stick-text" text-anchor="middle" font-size="6">AI</text>
    <path d="M 56 32 L 60 28" stroke="#000" stroke-width="1"/>
    <path d="M 56 38 L 62 38" stroke="#000" stroke-width="1"/>
    <path d="M 56 44 L 60 48" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Multiple arrows showing more output -->
  <path d="M 70 265 L 95 265" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 75 270 L 95 275" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 75 260 L 95 255" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Conveyor belt / track - BOTTOM -->
  <path d="M 100 260 L 500 260" stroke="#000" stroke-width="2"/>
  <path d="M 100 270 L 500 270" stroke="#000" stroke-width="2"/>

  <!-- Gate 1: SPEC - same gates -->
  <rect x="150" y="230" width="6" height="40" fill="#888" stroke="#000" stroke-width="1"/>
  <path d="M 156 235 L 156 250 L 168 250" stroke="#c00" stroke-width="2"/>
  <text x="153" y="225" class="label" text-anchor="middle">Spec</text>
  <!-- Gate keeper - arms up (stressed) -->
  <circle cx="168" cy="238" r="5" class="stick-fill"/>
  <path d="M 168 243 L 168 255" class="stick-line"/>
  <path d="M 168 246 L 162 240" class="stick-line"/>
  <path d="M 168 246 L 174 240" class="stick-line"/>
  <path d="M 168 255 L 164 265" class="stick-line"/>
  <path d="M 168 255 L 172 265" class="stick-line"/>

  <!-- Gate 2: TEST -->
  <rect x="240" y="230" width="6" height="40" fill="#888" stroke="#000" stroke-width="1"/>
  <path d="M 246 235 L 246 250 L 258 250" stroke="#c00" stroke-width="2"/>
  <text x="243" y="225" class="label" text-anchor="middle">Test</text>
  <!-- Gate keeper - arms up (stressed) -->
  <circle cx="258" cy="238" r="5" class="stick-fill"/>
  <path d="M 258 243 L 258 255" class="stick-line"/>
  <path d="M 258 246 L 252 240" class="stick-line"/>
  <path d="M 258 246 L 264 240" class="stick-line"/>
  <path d="M 258 255 L 254 265" class="stick-line"/>
  <path d="M 258 255 L 262 265" class="stick-line"/>

  <!-- Gate 3: REVIEW -->
  <rect x="330" y="230" width="6" height="40" fill="#888" stroke="#000" stroke-width="1"/>
  <path d="M 336 235 L 336 250 L 348 250" stroke="#c00" stroke-width="2"/>
  <text x="333" y="225" class="label" text-anchor="middle">Review</text>
  <!-- Gate keeper - arms up (stressed) -->
  <circle cx="348" cy="238" r="5" class="stick-fill"/>
  <path d="M 348 243 L 348 255" class="stick-line"/>
  <path d="M 348 246 L 342 240" class="stick-line"/>
  <path d="M 348 246 L 354 240" class="stick-line"/>
  <path d="M 348 255 L 344 265" class="stick-line"/>
  <path d="M 348 255 L 352 265" class="stick-line"/>

  <!-- Gate 4: MERGE -->
  <rect x="420" y="230" width="6" height="40" fill="#888" stroke="#000" stroke-width="1"/>
  <path d="M 426 235 L 426 250 L 438 250" stroke="#c00" stroke-width="2"/>
  <text x="423" y="225" class="label" text-anchor="middle">Merge</text>
  <!-- Gate keeper - arms up (stressed) -->
  <circle cx="438" cy="238" r="5" class="stick-fill"/>
  <path d="M 438 243 L 438 255" class="stick-line"/>
  <path d="M 438 246 L 432 240" class="stick-line"/>
  <path d="M 438 246 L 444 240" class="stick-line"/>
  <path d="M 438 255 L 434 265" class="stick-line"/>
  <path d="M 438 255 L 442 265" class="stick-line"/>

  <!-- HIGH volume - documents PACKED on track -->
  <!-- Before Spec - backed up -->
  <rect x="105" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="114" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="123" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="132" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="141" y="258" width="8" height="6" class="stick-fill"/>

  <!-- Between Spec and Test - packed -->
  <rect x="160" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="169" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="178" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="187" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="196" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="205" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="214" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="223" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="232" y="258" width="8" height="6" class="stick-fill"/>

  <!-- Between Test and Review - packed -->
  <rect x="250" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="259" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="268" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="277" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="286" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="295" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="304" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="313" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="322" y="258" width="8" height="6" class="stick-fill"/>

  <!-- Between Review and Merge - packed -->
  <rect x="340" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="349" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="358" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="367" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="376" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="385" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="394" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="403" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="412" y="258" width="8" height="6" class="stick-fill"/>

  <!-- After Merge -->
  <rect x="430" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="445" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="460" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="475" y="258" width="8" height="6" class="stick-fill"/>
  <rect x="490" y="258" width="8" height="6" class="stick-fill"/>

  <!-- Caption -->
  <text x="260" y="310" class="caption" text-anchor="middle">Same gates, same people, more traffic</text>
  <text x="260" y="325" class="stick-text" text-anchor="middle">(AI accelerates development, but humans still review)</text>

  <!-- Legend -->
  <rect x="20" y="350" width="8" height="6" class="stick-fill"/>
  <text x="35" y="356" class="stick-text">= work item</text>

  <path d="M 100 353 L 115 353" stroke="#090" stroke-width="2"/>
  <text x="120" y="356" class="stick-text">= gate open (low traffic)</text>

  <path d="M 230 353 L 245 353" stroke="#c00" stroke-width="2"/>
  <text x="250" y="356" class="stick-text">= gate backed up (high traffic)</text>

</svg>