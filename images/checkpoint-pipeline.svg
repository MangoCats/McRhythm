<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400">
  <style>
    .stick-line { fill: none; stroke: #000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .stick-fill { fill: #fffdf5; stroke: #000; stroke-width: 2; }
    .stick-text { font-family: 'Comic Sans MS', 'Chalkboard', cursive; font-size: 9px; }
    .label { font-family: 'Comic Sans MS', 'Chalkboard', cursive; font-size: 10px; font-weight: bold; }
    .caption { font-family: 'Comic Sans MS', 'Chalkboard', cursive; font-size: 12px; }
    .title { font-family: 'Comic Sans MS', 'Chalkboard', cursive; font-size: 11px; font-weight: bold; }
  </style>

  <!-- Paper white background -->
  <rect x="0" y="0" width="520" height="400" fill="#fffdf5"/>

  <!-- ==================== TOP PANEL: Human Development ==================== -->

  <text x="260" y="20" class="title" text-anchor="middle">Human Development</text>

  <!-- Four human developers on left -->
  <g transform="translate(15, 45)">
    <!-- Developer 1 -->
    <circle cx="20" cy="20" r="8" class="stick-fill"/>
    <path d="M 20 28 L 20 45" class="stick-line"/>
    <path d="M 20 32 L 12 40" class="stick-line"/>
    <path d="M 20 32 L 28 40" class="stick-line"/>
    <path d="M 20 45 L 14 58" class="stick-line"/>
    <path d="M 20 45 L 26 58" class="stick-line"/>
    <!-- Desk/computer -->
    <rect x="32" y="35" width="18" height="12" class="stick-fill"/>
    <rect x="34" y="37" width="14" height="8" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
  </g>

  <g transform="translate(15, 105)">
    <!-- Developer 2 -->
    <circle cx="20" cy="20" r="8" class="stick-fill"/>
    <path d="M 20 28 L 20 45" class="stick-line"/>
    <path d="M 20 32 L 12 40" class="stick-line"/>
    <path d="M 20 32 L 28 40" class="stick-line"/>
    <path d="M 20 45 L 14 58" class="stick-line"/>
    <path d="M 20 45 L 26 58" class="stick-line"/>
    <rect x="32" y="35" width="18" height="12" class="stick-fill"/>
    <rect x="34" y="37" width="14" height="8" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Arrow from developers to track -->
  <path d="M 70 95 L 95 95" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000"/>
    </marker>
  </defs>

  <!-- Conveyor belt / track - TOP -->
  <path d="M 100 90 L 500 90" stroke="#000" stroke-width="2"/>
  <path d="M 100 100 L 500 100" stroke="#000" stroke-width="2"/>

  <!-- Gate 1: SPEC -->
  <rect x="150" y="60" width="6" height="40" fill="#888" stroke="#000" stroke-width="1"/>
  <path d="M 156 65 L 156 80 L 168 80" stroke="#090" stroke-width="2"/>
  <text x="153" y="55" class="label" text-anchor="middle">Spec</text>
  <!-- Gate keeper - arms down -->
  <circle cx="168" cy="68" r="5" class="stick-fill"/>
  <path d="M 168 73 L 168 85" class="stick-line"/>
  <path d="M 168 76 L 162 82" class="stick-line"/>
  <path d="M 168 76 L 174 82" class="stick-line"/>
  <path d="M 168 85 L 164 95" class="stick-line"/>
  <path d="M 168 85 L 172 95" class="stick-line"/>

  <!-- Gate 2: TEST -->
  <rect x="240" y="60" width="6" height="40" fill="#888" stroke="#000" stroke-width="1"/>
  <path d="M 246 65 L 246 80 L 258 80" stroke="#090" stroke-width="2"/>
  <text x="243" y="55" class="label" text-anchor="middle">Test</text>
  <!-- Gate keeper - arms down -->
  <circle cx="258" cy="68" r="5" class="stick-fill"/>
  <path d="M 258 73 L 258 85" class="stick-line"/>
  <path d="M 258 76 L 252 82" class="stick-line"/>
  <path d="M 258 76 L 264 82" class="stick-line"/>
  <path d="M 258 85 L 254 95" class="stick-line"/>
  <path d="M 258 85 L 262 95" class="stick-line"/>

  <!-- Gate 3: REVIEW -->
  <rect x="330" y="60" width="6" height="40" fill="#888" stroke="#000" stroke-width="1"/>
  <path d="M 336 65 L 336 80 L 348 80" stroke="#090" stroke-width="2"/>
  <text x="333" y="55" class="label" text-anchor="middle">Review</text>
  <!-- Gate keeper - arms down -->
  <circle cx="348" cy="68" r="5" class="stick-fill"/>
  <path d="M 348 73 L 348 85" class="stick-line"/>
  <path d="M 348 76 L 342 82" class="stick-line"/>
  <path d="M 348 76 L 354 82" class="stick-line"/>
  <path d="M 348 85 L 344 95" class="stick-line"/>
  <path d="M 348 85 L 352 95" class="stick-line"/>

  <!-- Gate 4: MERGE -->
  <rect x="420" y="60" width="6" height="40" fill="#888" stroke="#000" stroke-width="1"/>
  <path d="M 426 65 L 426 80 L 438 80" stroke="#090" stroke-width="2"/>
  <text x="423" y="55" class="label" text-anchor="middle">Merge</text>
  <!-- Gate keeper - arms down -->
  <circle cx="438" cy="68" r="5" class="stick-fill"/>
  <path d="M 438 73 L 438 85" class="stick-line"/>
  <path d="M 438 76 L 432 82" class="stick-line"/>
  <path d="M 438 76 L 444 82" class="stick-line"/>
  <path d="M 438 85 L 434 95" class="stick-line"/>
  <path d="M 438 85 L 442 95" class="stick-line"/>

  <!-- LOW volume documents on track - spaced out -->
  <rect x="110" y="88" width="10" height="8" class="stick-fill"/>
  <rect x="130" y="88" width="10" height="8" class="stick-fill"/>

  <rect x="182" y="88" width="10" height="8" class="stick-fill"/>
  <rect x="210" y="88" width="10" height="8" class="stick-fill"/>

  <rect x="272" y="88" width="10" height="8" class="stick-fill"/>
  <rect x="300" y="88" width="10" height="8" class="stick-fill"/>

  <rect x="362" y="88" width="10" height="8" class="stick-fill"/>
  <rect x="390" y="88" width="10" height="8" class="stick-fill"/>

  <rect x="450" y="88" width="10" height="8" class="stick-fill"/>
  <rect x="470" y="88" width="10" height="8" class="stick-fill"/>
  <rect x="490" y="88" width="10" height="8" class="stick-fill"/>

  <!-- Dividing line -->
  <path d="M 20 175 L 500 175" stroke="#000" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- ==================== BOTTOM PANEL: AI-Assisted Development ==================== -->

  <text x="260" y="195" class="title" text-anchor="middle">AI-Assisted Development</text>

  <!-- Four human developers with AI on left -->
  <g transform="translate(15, 215)">
    <!-- Developer 1 with AI -->
    <circle cx="20" cy="20" r="8" class="stick-fill"/>
    <path d="M 20 28 L 20 45" class="stick-line"/>
    <path d="M 20 32 L 12 40" class="stick-line"/>
    <path d="M 20 32 L 28 40" class="stick-line"/>
    <path d="M 20 45 L 14 58" class="stick-line"/>
    <path d="M 20 45 L 26 58" class="stick-line"/>
