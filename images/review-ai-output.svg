<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .xkcd-line { fill: none; stroke: #000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .xkcd-fill { fill: #fffdf5; stroke: #000; stroke-width: 2; }
    .xkcd-text { font-family: 'Comic Sans MS', 'Chalkboard', cursive; font-size: 12px; }
    .screen-bg { fill: #e8e8e8; }
    .screen-text { font-family: monospace; font-size: 10px; fill: #333; }
  </style>

  <!-- Paper white background -->
  <rect x="0" y="0" width="400" height="300" fill="#fffdf5"/>

  <!-- Monitor -->
  <rect x="200" y="80" width="140" height="100" rx="5" class="xkcd-fill"/>
  <rect x="208" y="88" width="124" height="76" rx="2" class="screen-bg" stroke="#000" stroke-width="1"/>

  <!-- Screen content - code/terminal lines -->
  <text x="215" y="102" class="screen-text">$ ai generate</text>
  <text x="215" y="114" class="screen-text">function foo() {</text>
  <text x="215" y="126" class="screen-text">  return bar;</text>
  <text x="215" y="138" class="screen-text">  // TODO: fix</text>
  <text x="215" y="150" class="screen-text">}</text>
  <text x="215" y="162" class="screen-text" fill="#666">█</text>

  <!-- Monitor stand -->
  <path d="M 260 180 L 260 200 Q 260 205 255 205 L 285 205 Q 280 205 280 200 L 280 180" class="xkcd-line"/>
  <path d="M 240 205 Q 270 215 300 205" class="xkcd-line"/>

  <!-- Stick figure - side view facing right toward screen -->
  <!-- Head (circle, no face) -->
  <circle cx="140" cy="130" r="18" class="xkcd-fill"/>

  <!-- Hair - side view, messy, pointing backward -->
  <path d="M 125 118 Q 115 112 120 120" class="xkcd-line"/>
  <path d="M 123 125 Q 110 122 117 128" class="xkcd-line"/>
  <path d="M 122 132 Q 113 135 120 138" class="xkcd-line"/>

  <!-- Body - slight lean forward -->
  <path d="M 140 148 L 145 210" class="xkcd-line"/>

  <!-- Back arm (resting) - extends from left side of torso -->
  <path d="M 138 165 L 115 195" class="xkcd-line"/>

  <!-- Front arm - reaching to hold magnifying glass handle at 30% from end -->
  <path d="M 147 160 Q 165 165 179 177" class="xkcd-line"/>

  <!-- Legs -->
  <path d="M 145 210 L 130 260" class="xkcd-line"/>
  <path d="M 145 210 L 160 260" class="xkcd-line"/>

  <!-- Magnifying glass - lens centered on TODO line (y=138) -->
  <circle cx="235" cy="138" r="28" fill="none" stroke="#000" stroke-width="3"/>
  <circle cx="235" cy="138" r="25" fill="rgba(255,255,240,0.4)" stroke="none"/>

  <!-- Magnifying glass handle - angled down to hand -->
  <path d="M 212 158 L 165 185" stroke="#000" stroke-width="5" stroke-linecap="round"/>

  <!-- Thought bubble - sized for text -->
  <ellipse cx="100" cy="55" rx="55" ry="22" class="xkcd-fill"/>
  <circle cx="120" cy="85" r="5" class="xkcd-fill"/>
  <circle cx="130" cy="100" r="3" class="xkcd-fill"/>

  <!-- Thought text - fits in bubble -->
  <text x="100" y="52" class="xkcd-text" text-anchor="middle">is this right?</text>
  <text x="100" y="66" class="xkcd-text" text-anchor="middle" font-size="10">hmm...</text>
</svg>