<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#facc15;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="300" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e2e8f0" text-anchor="middle">AI Productivity by Project Context</text>

  <!-- Axis labels -->
  <text x="300" y="430" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Project Complexity</text>
  <text x="25" y="230" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" transform="rotate(-90, 25, 230)">Codebase Familiarity</text>

  <!-- Axis arrows -->
  <line x1="80" y1="400" x2="550" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="80" y1="400" x2="80" y2="60" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Axis tick labels -->
  <text x="180" y="418" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Simple</text>
  <text x="450" y="418" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Complex</text>
  <text x="70" y="340" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">Greenfield</text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">Brownfield</text>

  <!-- Quadrants -->
  <!-- Top-left: Simple + Brownfield = 15-20% -->
  <rect x="90" y="70" width="185" height="160" rx="8" fill="url(#yellowGrad)"/>
  <text x="182" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">15-20%</text>
  <text x="182" y="165" font-family="Arial, sans-serif" font-size="13" fill="#1a1a2e" text-anchor="middle">Moderate gains</text>
  <text x="182" y="185" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">Simple + Brownfield</text>

  <!-- Top-right: Complex + Brownfield = 0-10% -->
  <rect x="285" y="70" width="185" height="160" rx="8" fill="url(#redGrad)"/>
  <text x="377" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">0-10%</text>
  <text x="377" y="165" font-family="Arial, sans-serif" font-size="13" fill="#1a1a2e" text-anchor="middle">Minimal gains</text>
  <text x="377" y="185" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">Complex + Brownfield</text>

  <!-- Bottom-left: Simple + Greenfield = 30-40% -->
  <rect x="90" y="240" width="185" height="150" rx="8" fill="url(#greenGrad)"/>
  <text x="182" y="305" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">30-40%</text>
  <text x="182" y="330" font-family="Arial, sans-serif" font-size="13" fill="#1a1a2e" text-anchor="middle">Highest gains</text>
  <text x="182" y="350" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">Simple + Greenfield</text>

  <!-- Bottom-right: Complex + Greenfield = 10-15% -->
  <rect x="285" y="240" width="185" height="150" rx="8" fill="url(#orangeGrad)"/>
  <text x="377" y="305" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">10-15%</text>
  <text x="377" y="330" font-family="Arial, sans-serif" font-size="13" fill="#1a1a2e" text-anchor="middle">Modest gains</text>
  <text x="377" y="350" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">Complex + Greenfield</text>

  <!-- METR callout -->
  <rect x="480" y="70" width="110" height="80" rx="6" fill="#7f1d1d" stroke="#dc2626" stroke-width="2"/>
  <text x="535" y="95" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">METR RCT 2025</text>
  <text x="535" y="118" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fef2f2" text-anchor="middle">-19%</text>
  <text x="535" y="138" font-family="Arial, sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">Familiar codebase</text>
</svg>