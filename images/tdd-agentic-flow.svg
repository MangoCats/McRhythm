<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <marker id="flowArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="iterateArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <marker id="successArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="450" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="350" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e2e8f0" text-anchor="middle">TDD with Agentic Coding</text>
  <text x="350" y="55" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Anthropic Best Practices</text>

  <!-- Step 1: Write Tests -->
  <rect x="50" y="90" width="180" height="100" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="middle">1. Write Tests</text>
  <text x="140" y="145" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">"This is TDD, do not</text>
  <text x="140" y="160" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">create mock implementations"</text>
  <text x="140" y="180" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Agent writes tests first</text>

  <!-- Arrow 1->2 -->
  <path d="M230,140 L280,140" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#flowArrow)"/>

  <!-- Step 2: Confirm Fail -->
  <rect x="290" y="90" width="150" height="100" rx="10" fill="#4c1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="365" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f87171" text-anchor="middle">2. Tests FAIL</text>
  <text x="365" y="145" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Confirm tests fail</text>
  <text x="365" y="165" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">(validates they work)</text>
  <!-- Red X -->
  <g transform="translate(365, 175)">
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#ef4444" stroke-width="3"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#ef4444" stroke-width="3"/>
  </g>

  <!-- Arrow 2->3 -->
  <path d="M440,140 L490,140" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#flowArrow)"/>

  <!-- Step 3: Write Code -->
  <rect x="500" y="90" width="180" height="100" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="590" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="middle">3. Write Code</text>
  <text x="590" y="145" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">"Do not modify tests"</text>
  <text x="590" y="165" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Implementation only</text>
  <text x="590" y="180" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Agent codes to pass tests</text>

  <!-- Arrow 3->Decision -->
  <path d="M590,190 L590,230" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#flowArrow)"/>

  <!-- Decision Diamond -->
  <polygon points="590,240 650,280 590,320 530,280" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="590" y="275" font-family="Arial, sans-serif" font-size="12" fill="#c4b5fd" text-anchor="middle">Tests</text>
  <text x="590" y="290" font-family="Arial, sans-serif" font-size="12" fill="#c4b5fd" text-anchor="middle">Pass?</text>

  <!-- NO path - iterate -->
  <path d="M530,280 L400,280 L400,190" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#iterateArrow)" stroke-dasharray="5,3"/>
  <rect x="430" y="265" width="40" height="20" rx="3" fill="#1a1a2e"/>
  <text x="450" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f97316" text-anchor="middle">NO</text>
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="10" fill="#fb923c" text-anchor="middle">Iterate</text>

  <!-- YES path - success -->
  <path d="M590,320 L590,370" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#successArrow)"/>
  <text x="610" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#22c55e">YES</text>

  <!-- Success box -->
  <rect x="510" y="380" width="160" height="50" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="590" y="405" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#86efac" text-anchor="middle">Done</text>
  <text x="590" y="420" font-family="Arial, sans-serif" font-size="10" fill="#bbf7d0" text-anchor="middle">All tests passing</text>

  <!-- Verification Agent (separate concern) -->
  <rect x="50" y="260" width="200" height="130" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="150" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c4b5fd" text-anchor="middle">Verification Agent</text>
  <text x="150" y="305" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">(Separate concern)</text>

  <line x1="70" y1="320" x2="230" y2="320" stroke="#4b5563" stroke-width="1"/>

  <text x="150" y="340" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">- Reviews code quality</text>
  <text x="150" y="355" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">- Checks test coverage</text>
  <text x="150" y="370" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">- Validates logic</text>
  <text x="150" y="385" font-family="Arial, sans-serif" font-size="10" fill="#a855f7" text-anchor="middle" font-style="italic">Independent from coding agent</text>

  <!-- Connection from main flow to verification -->
  <path d="M500,140 L290,280" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
  <circle cx="290" cy="280" r="4" fill="#a855f7"/>

  <!-- Key insight box -->
  <rect x="280" y="380" width="200" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="380" y="400" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Key: Separation of Concerns</text>
  <text x="380" y="418" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">One agent codes, another verifies</text>
</svg>