<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400">
  <defs>
    <linearGradient id="optimalZone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="warningZone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="dangerZone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="650" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="325" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Context Rot: Accuracy Degradation</text>

  <!-- Zones (background) -->
  <rect x="80" y="60" width="180" height="280" fill="url(#optimalZone)"/>
  <rect x="260" y="60" width="160" height="280" fill="url(#warningZone)"/>
  <rect x="420" y="60" width="170" height="280" fill="url(#dangerZone)"/>

  <!-- Zone labels -->
  <text x="170" y="80" font-family="Arial, sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">OPTIMAL</text>
  <text x="340" y="80" font-family="Arial, sans-serif" font-size="11" fill="#eab308" text-anchor="middle">DEGRADING</text>
  <text x="505" y="80" font-family="Arial, sans-serif" font-size="11" fill="#ef4444" text-anchor="middle">DEPLETED</text>

  <!-- Y-axis -->
  <line x1="80" y1="60" x2="80" y2="340" stroke="#64748b" stroke-width="2"/>
  <text x="40" y="200" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" transform="rotate(-90, 40, 200)">Recall Accuracy</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="90" x2="80" y2="90" stroke="#64748b" stroke-width="2"/>
  <text x="70" y="94" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">100%</text>

  <line x1="75" y1="152" x2="80" y2="152" stroke="#64748b" stroke-width="2"/>
  <text x="70" y="156" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">80%</text>

  <line x1="75" y1="215" x2="80" y2="215" stroke="#64748b" stroke-width="2"/>
  <text x="70" y="219" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">60%</text>

  <line x1="75" y1="277" x2="80" y2="277" stroke="#64748b" stroke-width="2"/>
  <text x="70" y="281" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">40%</text>

  <line x1="75" y1="340" x2="80" y2="340" stroke="#64748b" stroke-width="2"/>
  <text x="70" y="344" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">20%</text>

  <!-- X-axis -->
  <line x1="80" y1="340" x2="590" y2="340" stroke="#64748b" stroke-width="2"/>
  <text x="335" y="380" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Context Window Usage</text>

  <!-- X-axis ticks -->
  <line x1="80" y1="340" x2="80" y2="345" stroke="#64748b" stroke-width="2"/>
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0%</text>

  <line x1="207" y1="340" x2="207" y2="345" stroke="#64748b" stroke-width="2"/>
  <text x="207" y="360" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">25%</text>

  <line x1="335" y1="340" x2="335" y2="345" stroke="#64748b" stroke-width="2"/>
  <text x="335" y="360" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">50%</text>

  <line x1="462" y1="340" x2="462" y2="345" stroke="#64748b" stroke-width="2"/>
  <text x="462" y="360" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">75%</text>

  <line x1="590" y1="340" x2="590" y2="345" stroke="#64748b" stroke-width="2"/>
  <text x="590" y="360" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">100%</text>

  <!-- The degradation curve -->
  <path d="M80,95
           C120,95 150,98 207,110
           C280,130 335,165 400,220
           C450,265 500,300 550,320
           L590,335"
        fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

  <!-- Curve glow effect -->
  <path d="M80,95
           C120,95 150,98 207,110
           C280,130 335,165 400,220
           C450,265 500,300 550,320
           L590,335"
        fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" opacity="0.2"/>

  <!-- Key points on curve -->
  <circle cx="170" cy="100" r="6" fill="#22c55e"/>
  <circle cx="340" cy="175" r="6" fill="#eab308"/>
  <circle cx="500" cy="300" r="6" fill="#ef4444"/>

  <!-- Annotation: Attention budget -->
  <rect x="420" y="100" width="150" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="495" y="122" font-family="Arial, sans-serif" font-size="11" fill="#f87171" text-anchor="middle" font-weight="bold">"Attention Budget"</text>
  <text x="495" y="140" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">depleted in this zone</text>
  <line x1="495" y1="160" x2="495" y2="290" stroke="#475569" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Annotation: Sweet spot -->
  <rect x="95" y="115" width="120" height="45" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="155" y="135" font-family="Arial, sans-serif" font-size="10" fill="#86efac" text-anchor="middle">Sweet Spot</text>
  <text x="155" y="150" font-family="Arial, sans-serif" font-size="9" fill="#bbf7d0" text-anchor="middle">High accuracy, low cost</text>

  <!-- Legend -->
  <rect x="80" y="385" width="12" height="4" fill="#f97316"/>
  <text x="98" y="390" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Recall accuracy degrades as context fills</text>

  <!-- Source attribution -->
  <text x="590" y="390" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="end">Source: JetBrains Research, NeurIPS 2025</text>
</svg>